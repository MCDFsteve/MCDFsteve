<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" aria-label="世界线收束"><title>世界线收束</title><style>:root{--ink:#1F2328;--sub:#59636E;--faint:#D1D9E0;--red:#D9263E;--blue:#2D62CC;--heat0:#EDEFF2;--heat1:#FAD9DC;--heat2:#F2A6AE;--heat3:#E05666;--heat4:#A91529}@media (prefers-color-scheme:dark){:root{--ink:#E6EDF3;--sub:#9198A1;--faint:#3D444D;--red:#F0495A;--blue:#5B93F0;--heat0:#1C222C;--heat1:#3D1E27;--heat2:#74222E;--heat3:#BC2A3C;--heat4:#FF6473}}
