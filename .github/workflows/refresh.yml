name: 刷新主页图片

# README.md 是手写的，这里从不改它；只重画 assets/ 并更新 data/。
on:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths:
      - profile.toml
      - tools/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取最新数字
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py
      - name: 重画图片
        run: python tools/build.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet && exit 0
          git commit -m "刷新主页图片 $(date -u +%F)"
          git pull --rebase origin main
          git push
